<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Món Quà Bí Mật 20/10 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4d79;
            --primary-light: #ff85a2;
            --secondary: #ffb3c6;
            --bg-grad-1: #fff0f3;
            --bg-grad-2: #ffe5ec;
            --bg-grad-3: #ffc2d1;
            --text-dark: #4a2531;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--text-dark);
        }

        #petal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Nút bật/tắt nhạc */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid var(--secondary);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 121, 0.25);
            transition: transform 0.3s ease;
        }

        .music-btn.playing {
            animation: spinSlow 6s linear infinite;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 460px;
            margin: 20px auto;
        }

        /* Màn hình 1: Hộp quà & Nhập tên */
        .screen-intro {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 77, 121, 0.18), inset 0 0 0 2px rgba(255, 255, 255, 0.9);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gift-wrapper {
            width: 135px;
            height: 135px;
            margin: 0 auto 18px;
            cursor: pointer;
            position: relative;
            animation: giftBounce 2.4s ease-in-out infinite;
        }

        .gift-wrapper.opening {
            animation: giftExplode 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }

        @keyframes giftBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-3deg); }
            50% { transform: translateY(0) rotate(3deg); }
            75% { transform: translateY(-4px) rotate(-2deg); }
        }

        @keyframes giftExplode {
            0% { transform: scale(1); }
            40% { transform: scale(1.22) rotate(6deg); }
            100% { transform: scale(0) opacity(0); }
        }

        .intro-badge {
            display: inline-block;
            background: #ffe0e9;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .intro-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .intro-desc {
            font-size: 0.95rem;
            color: #6e4453;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .name-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 16px;
            border: 2px solid var(--secondary);
            background: rgba(255, 255, 255, 0.95);
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 77, 121, 0.15);
            transform: translateY(-1px);
        }

        .name-input.shake {
            animation: shakeError 0.4s ease;
            border-color: #ff2a55;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-6px); }
        }

        .btn-open {
            width: 100%;
            padding: 15px 24px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, #ff7597 100%);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(255, 77, 121, 0.35);
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(255, 77, 121, 0.45);
        }

        .btn-open:active {
            transform: translateY(0);
        }

        /* Màn hình 2: Thiệp chúc mừng */
        .screen-card {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 34px 26px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(255, 77, 121, 0.22), inset 0 0 0 2px #ffffff;
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .bouquet-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            animation: floatBouquet 3s ease-in-out infinite;
        }

        @keyframes floatBouquet {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-7px) rotate(3deg); }
        }

        .card-date {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            background: #ffe5ec;
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .card-greeting {
            font-family: 'Dancing Script', cursive;
            font-size: 2.35rem;
            color: var(--primary);
            margin-bottom: 16px;
            line-height: 1.25;
            word-break: break-word;
        }

        .wish-box {
            background: linear-gradient(180deg, #fff8fa 0%, #fff0f4 100%);
            border: 1.5px dashed var(--secondary);
            border-radius: 20px;
            padding: 20px 18px;
            min-height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
        }

        .wish-text {
            font-size: 1.02rem;
            line-height: 1.7;
            color: #4a2531;
            font-weight: 500;
            text-align: center;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: var(--primary);
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.75s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Khu vực nút bấm tương tác vui */
        .interactive-area {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            margin-top: 8px;
        }

        .interactive-area.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .question-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #7a4959;
            margin-bottom: 14px;
        }

        .btn-group-fun {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            min-height: 52px;
            position: relative;
        }

        .btn-love {
            padding: 11px 22px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff4d79, #ff7597);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 77, 121, 0.35);
            transition: transform 0.2s ease;
        }

        .btn-love:hover {
            transform: scale(1.06);
        }

        .btn-runaway {
            padding: 11px 18px;
            border-radius: 14px;
            border: 1.5px solid #e2b6c3;
            background: white;
            color: #7a4959;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .sweet-response {
            display: none;
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            background: #ffe5ec;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.95rem;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Hiệu ứng lấp lánh theo chuột / cảm ứng */
        .sparkle-trail {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 16px;
            animation: trailFade 0.9s ease-out forwards;
        }

        @keyframes trailFade {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
            100% { transform: translate(-50%, -95%) scale(1.25) rotate(25deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="petal-canvas"></canvas>

    <button id="music-toggle" class="music-btn" title="Bật/Tắt nhạc">🎵</button>

    <div class="container">
        <!-- Màn hình 1: Mở hộp quà -->
        <div id="screen-intro" class="screen-intro">
            <span class="intro-badge">✨ SECRET GARDEN 20/10 ✨</span>
            
            <div id="gift-box" class="gift-wrapper" title="Nhập tên rồi bấm mở quà nhé!">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="48" width="80" height="56" rx="8" fill="#FF4D79"/>
                    <rect x="14" y="34" width="92" height="18" rx="6" fill="#FF7597"/>
                    <rect x="53" y="34" width="14" height="70" fill="#FFE5EC"/>
                    <rect x="20" y="69" width="80" height="12" fill="#FFE5EC"/>
                    <path d="M60 34C60 34 42 14 32 24C22 34 45 36 60 34Z" fill="#FFB3C6" stroke="#FF4D79" stroke-width="3"/>
                    <path d="M60 34C60 34 78 14 88 24C98 34 75 36 60 34Z" fill="#FFB3C6" stroke="#FF4D79" stroke-width="3"/>
                    <circle cx="60" cy="33" r="6" fill="#FFE5EC"/>
                </svg>
            </div>

            <h1 class="intro-title">Món Quà Bí Mật</h1>
            <p class="intro-desc">Có một hộp quà 20/10 đang đợi được mở khóa.<br>Hãy nhập tên của bạn để mở hộp quà nhé!</p>

            <div class="input-group">
                <input type="text" id="username-input" class="name-input" placeholder="Nhập tên của bạn" autocomplete="off" maxlength="40">
            </div>

            <button id="btn-open" class="btn-open">Mở khóa hộp quà 🎁</button>
        </div>

        <!-- Màn hình 2: Thiệp chúc mừng -->
        <div id="screen-card" class="screen-card">
            <div class="bouquet-icon">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M40 65L60 108L80 65H40Z" fill="#FFB3C6"/>
                    <path d="M45 65L60 105L75 65H45Z" fill="#FF85A2"/>
                    <path d="M48 92C48 92 60 88 72 92" stroke="#FF4D79" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="44" cy="48" r="16" fill="#FF4D79"/>
                    <circle cx="76" cy="48" r="16" fill="#FF7597"/>
                    <circle cx="60" cy="36" r="18" fill="#FF5C8A"/>
                    <circle cx="60" cy="54" r="15" fill="#FF99B4"/>
                    <circle cx="44" cy="48" r="6" fill="#FFE5EC"/>
                    <circle cx="76" cy="48" r="6" fill="#FFE5EC"/>
                    <circle cx="60" cy="36" r="7" fill="#FFE5EC"/>
                    <circle cx="60" cy="54" r="6" fill="#FFF0F3"/>
                </svg>
            </div>

            <span class="card-date">Happy Vietnamese Women's Day 20/10</span>
            <h2 id="card-greeting" class="card-greeting">Gửi bạn!</h2>

            <div class="wish-box">
                <p class="wish-text">
                    <span id="typewriter-text"></span><span id="cursor" class="cursor-blink"></span>
                </p>
            </div>

            <div id="interactive-area" class="interactive-area">
                <p class="question-title">Cậu có thích món quà tinh thần này không? 🌸</p>
                <div id="btn-group-fun" class="btn-group-fun">
                    <button id="btn-love" class="btn-love">Thích lắm luôn ❤️</button>
                    <button id="btn-runaway" class="btn-runaway">Bình thường thôi 😝</button>
                </div>
                <div id="sweet-response" class="sweet-response">
                    Biết ngay mà! Chúc cậu một ngày 20/10 ngập tràn niềm vui và nụ cười nhé! 🥰💖✨
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DANH SÁCH 10 LỜI CHÚC ĐA DẠNG PHONG CÁCH (TỰ ĐỘNG ĐỔI MỖI LẦN MỞ QUÀ) ---
        const wishesPool = [
            // Phong cách 1: Dịu dàng, truyền thống
            "Nhân ngày 20/10, chúc {name} luôn rạng rỡ như những đóa hoa mùa thu, giữ mãi nụ cười tỏa nắng trên môi và luôn được yêu thương, chiều chuộng mỗi ngày nhé! 🌸",
            
            // Phong cách 2: Ngắn gọn, hiện đại, năng lượng tích cực
            "Hôm nay là ngày của {name} đó! Chúc cậu 365 ngày đều xinh đẹp, tự tin, độc lập và luôn lấp lánh theo cách riêng tuyệt vời nhất của chính mình! ✨💖",
            
            // Phong cách 3: Hài hước, đáng yêu
            "Thông báo khẩn nhân dịp 20/10: Chúc {name} nhan sắc thăng hạng vù vù, tiền tiêu rủng rỉnh, ăn ngon không sợ béo và lúc nào cũng yêu đời hết nấc nha! 🎁🌷",
            
            // Phong cách 4: Thơ mộng, sâu sắc
            "Thế giới này dịu dàng và rực rỡ hơn rất nhiều vì có những bông hoa như {name}. Mong rằng mọi điều tốt đẹp, bình yên và ngọt ngào nhất sẽ luôn tìm đến bên cậu hôm nay và cả những ngày sau. 💌",
            
            // Phong cách 5: Ngọt ngào, ấm áp
            "Gửi ngàn lời chúc tốt đẹp nhất đến {name} trong ngày 20/10! Hãy gác lại mọi âu lo để tận hưởng một ngày thật trọn vẹn, hạnh phúc và ngập tràn những bất ngờ dễ thương nhé! 🥰",
            
            // Phong cách 6: Tinh tế, khích lệ
            "20/10 thật vui vẻ nhé {name}! Cảm ơn cậu vì đã luôn dịu dàng, tỏa sáng và mang lại năng lượng tích cực cho mọi người xung quanh. Chúc mọi ước mơ của cậu sớm thành hiện thực! 🌺✨",
            
            // Phong cách 7: Bay bổng, lãng mạn
            "Chẳng cần đợi đến 20/10 thì {name} mới xứng đáng được nâng niu, nhưng hôm nay là dịp đặc biệt để nhắc rằng: Cậu vô cùng tuyệt vời! Chúc cậu luôn bình an và ngập tràn hạnh phúc! 💐💖",
            
            // Phong cách 8: Trẻ trung, vui tươi
            "Happy Women's Day 20/10! Chúc {name} mỗi sáng thức dậy đều thấy lòng phơi phới, đi đến đâu cũng gặp may mắn, làm gì cũng suôn sẻ và luôn giữ mãi nét đáng yêu này nhé! 🎀🌸",
            
            // Phong cách 9: Chân thành, gần gũi
            "Nhân ngày Phụ nữ Việt Nam 20/10, chúc {name} luôn giữ được trái tim ấm áp, đôi mắt biết cười và tâm hồn tự do tự tại. Mong cậu mỗi ngày đều tìm thấy thật nhiều niềm vui nhỏ bé! 🌷✨",
            
            // Phong cách 10: Rực rỡ, chúc phúc trọn vẹn
            "Món quà nhỏ này mang theo lời chúc 20/10 đặc biệt gửi tới {name}: Chúc cậu luôn tươi trẻ như hoa đầu mùa, hạnh phúc đong đầy và luôn là phiên bản rạng rỡ, kiêu hãnh nhất! 👑💝"
        ];

        // Hàm lấy lời chúc ngẫu nhiên nhưng không trùng với lần mở ngay trước đó
        function getRandomWish(name) {
            let lastIndex = parseInt(localStorage.getItem('last_wish_20_10_idx'), 10);
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * wishesPool.length);
            } while (randomIndex === lastIndex && wishesPool.length > 1);

            localStorage.setItem('last_wish_20_10_idx', randomIndex);
            return wishesPool[randomIndex].replace(/\{name\}/g, name);
        }

        // --- 2. HỘP NHẠC WEB AUDIO API (KHÔNG CẦN FILE MP3 NGOÀI) ---
        let audioCtx = null;
        let isPlayingMusic = false;
        let melodyInterval = null;

        const melodyNotes = [
            523.25, 659.25, 783.99, 1046.50, 880.00, 783.99, 659.25, 587.33,
            523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 659.25
        ];
        let noteIdx = 0;

        function playMusicBoxNote(freq) {
            if (!audioCtx || !isPlayingMusic) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.45);
        }

        function startBackgroundMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isPlayingMusic = true;
            const musicBtn = document.getElementById('music-toggle');
            musicBtn.style.display = 'flex';
            musicBtn.classList.add('playing');
            musicBtn.textContent = '🎵';

            playMusicBoxNote(melodyNotes[0]);
            melodyInterval = setInterval(() => {
                if (isPlayingMusic) {
                    noteIdx = (noteIdx + 1) % melodyNotes.length;
                    playMusicBoxNote(melodyNotes[noteIdx]);
                }
            }, 520);
        }

        document.getElementById('music-toggle').addEventListener('click', function() {
            isPlayingMusic = !isPlayingMusic;
            if (isPlayingMusic) {
                this.classList.add('playing');
                this.textContent = '🎵';
            } else {
                this.classList.remove('playing');
                this.textContent = '🔇';
            }
        });

        // --- 3. XỬ LÝ MỞ QUÀ & HIỆU ỨNG GÕ CHỮ ---
        const inputEl = document.getElementById('username-input');
        const btnOpen = document.getElementById('btn-open');
        const giftBox = document.getElementById('gift-box');
        const screenIntro = document.getElementById('screen-intro');
        const screenCard = document.getElementById('screen-card');
        const greetingEl = document.getElementById('card-greeting');
        const typewriterEl = document.getElementById('typewriter-text');
        const cursorEl = document.getElementById('cursor');
        const interactiveArea = document.getElementById('interactive-area');

        function handleOpenGift() {
            const rawName = inputEl.value.trim();
            if (!rawName) {
                inputEl.classList.remove('shake');
                void inputEl.offsetWidth;
                inputEl.classList.add('shake');
                inputEl.focus();
                return;
            }

            giftBox.classList.add('opening');
            startBackgroundMusic();

            // Bắn pháo giấy chúc mừng
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff4d79', '#ff85a2', '#ffb3c6', '#ffe5ec', '#ffd166']
                });
            }

            setTimeout(() => {
                screenIntro.style.display = 'none';
                screenCard.style.display = 'block';
                greetingEl.textContent = `Chúc mừng 20/10, ${rawName}!`;

                const selectedWish = getRandomWish(rawName);
                typeWriterEffect(selectedWish, 0);
            }, 650);
        }

        function typeWriterEffect(text, index) {
            if (index < text.length) {
                typewriterEl.textContent += text.charAt(index);
                setTimeout(() => typeWriterEffect(text, index + 1), 32);
            } else {
                cursorEl.style.display = 'none';
                interactiveArea.classList.add('visible');
            }
        }

        btnOpen.addEventListener('click', handleOpenGift);
        giftBox.addEventListener('click', handleOpenGift);
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleOpenGift();
        });

        // --- 4. NÚT BẤM CHẠY TRỐN VUI NHỘN ---
        const btnRunaway = document.getElementById('btn-runaway');
        const btnLove = document.getElementById('btn-love');
        const sweetResponse = document.getElementById('sweet-response');
        const btnGroupFun = document.getElementById('btn-group-fun');

        const teasingTexts = [
            "Ơ kìa bấm nhầm rồi 😝",
            "Bấm nút màu hồng cơ! 💖",
            "Không bấm được đâu 😜",
            "Thích lắm đúng không! 🥰",
            "Đừng dối lòng nha 🌸"
        ];
        let teaseIdx = 0;

        function moveRunawayButton(e) {
            if (e) e.preventDefault();
            const offsetX = (Math.random() - 0.5) * 160;
            const offsetY = (Math.random() - 0.5) * 90;
            btnRunaway.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            btnRunaway.textContent = teasingTexts[teaseIdx % teasingTexts.length];
            teaseIdx++;
        }

        btnRunaway.addEventListener('mouseover', moveRunawayButton);
        btnRunaway.addEventListener('touchstart', moveRunawayButton, { passive: false });
        btnRunaway.addEventListener('click', moveRunawayButton);

        btnLove.addEventListener('click', () => {
            btnGroupFun.style.display = 'none';
            sweetResponse.style.display = 'block';
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 90,
                    origin: { y: 0.65 }
                });
            }
        });

        // --- 5. HIỆU ỨNG MƯA CÁNH HOA ĐÀO TRÊN CANVAS ---
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');
        let petals = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
                this.opacity = Math.random() * 0.45 + 0.35;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.4;
                this.angle += this.spin;
                if (this.y > canvas.height + 20) {
                    this.reset(false);
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.size / 2, -this.size / 2, this.size, this.size / 3, 0, this.size);
                ctx.bezierCurveTo(-this.size, this.size / 3, -this.size / 2, -this.size / 2, 0, 0);
                ctx.fillStyle = `rgba(255, 133, 162, ${this.opacity})`;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 32; i++) {
            petals.push(new Petal());
        }

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // --- 6. HIỆU ỨNG LẤP LÁNH THEO CHUỘT / VUỐT MÀN HÌNH ---
        let lastTrailTime = 0;
        const icons = ['🌸', '✨', '💖', '🌷'];

        function createTrail(x, y) {
            const now = Date.now();
            if (now - lastTrailTime < 90) return;
            lastTrailTime = now;

            const span = document.createElement('span');
            span.className = 'sparkle-trail';
            span.textContent = icons[Math.floor(Math.random() * icons.length)];
            span.style.left = x + 'px';
            span.style.top = y + 'px';
            document.body.appendChild(span);

            setTimeout(() => span.remove(), 900);
        }

        window.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                createTrail(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
    </script>
</body>
</html>
